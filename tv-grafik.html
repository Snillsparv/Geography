<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jonas geografi &mdash; TV-grafik</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #02060d; overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; cursor: pointer; }
  #karta { position: fixed; inset: 0; }
  .maplibregl-ctrl-attrib { display: none !important; }

  /* stjärnor bakom globen */
  .stjarna { position: fixed; border-radius: 50%; background: #cfe3ff; z-index: 1;
    pointer-events: none; }
  @keyframes blinka { 0%, 100% { opacity: .2; } 50% { opacity: .9; } }
  #karta { z-index: 2; }

  /* ── titelplattor (steg 1 och sista steget) ── */
  .platta { position: fixed; left: 0; right: 0; bottom: 9vh; text-align: center;
    z-index: 10; pointer-events: none; opacity: 0; transition: opacity .6s ease; }
  .platta.synlig { opacity: 1; }
  .platta .titel { font-size: 7vh; font-weight: 900; color: #ffdc32;
    text-shadow: 0 4px 0 #000c, 0 0 44px #ffdc3233; }
  .platta .undertitel { font-size: 3.4vh; font-weight: 700; color: #cfe3f4;
    margin-top: 1.2vh; text-shadow: 0 2px 8px #000; }

  /* ── landkortet (till höger, kameran lämnar plats) ── */
  #kort { position: fixed; top: 50%; right: 4vw; transform: translateY(-50%);
    width: min(34vw, 62vh); background: #10233acc; border: 1px solid rgba(91,191,255,.25);
    border-radius: 22px; padding: 3.2vh 2.6vw; z-index: 10; pointer-events: none;
    backdrop-filter: blur(6px); box-shadow: 0 24px 70px #000c;
    opacity: 0; transition: opacity .45s ease; }
  #kort.synlig { opacity: 1; }
  #kort img { display: block; max-width: 100%; max-height: 34vh; margin: 0 auto;
    filter: drop-shadow(0 10px 30px #000c);
    animation: poppin .75s cubic-bezier(.2, 1.7, .35, 1) both; }
  @keyframes poppin { from { transform: scale(.25) rotate(-7deg); opacity: 0; }
                      to { transform: scale(1) rotate(0); opacity: 1; } }
  #kort .fraga { font-size: 2.6vh; font-weight: 700; color: #7ea6c4; margin-top: 2.4vh;
    animation: infran .5s .35s both; }
  #kort .assoc { font-size: 3.8vh; font-weight: 800; color: #eaf4ff; line-height: 1.3;
    margin-top: 1vh; animation: infran .5s .55s both; }
  #kort .assoc b { color: #ffdc32; }
  #kort .pil { font-size: 3.6vh; margin-top: 1.8vh; color: #5fca77;
    animation: infran .5s 1.05s both; }
  #kort .namn { font-size: 5.6vh; font-weight: 900; color: #5fca77;
    text-shadow: 0 3px 0 #000a; }
  @keyframes infran { from { transform: translateX(3vh); opacity: 0; }
                      to { transform: translateX(0); opacity: 1; } }

  .url { position: fixed; bottom: 3vh; left: 0; right: 0; text-align: center;
    font-size: 2.8vh; font-weight: 800; color: #ffdc32; letter-spacing: .04em;
    text-shadow: 0 2px 0 #000c; z-index: 10; pointer-events: none; }

  /* diskret stegvisare + starttips */
  #prickar { position: fixed; bottom: 3.2vh; left: 3vh; display: flex; gap: 1vh;
    z-index: 10; pointer-events: none; }
  #prickar i { width: 1.2vh; height: 1.2vh; border-radius: 50%; background: #ffffff2e; }
  #prickar i.nu { background: #ffdc32aa; }
</style>
</head>
<body>
<div id="karta"></div>

<div class="platta" id="platta-intro">
  <div class="titel">Jonas geografi</div>
  <div class="undertitel">Alla v&auml;rldens l&auml;nder &mdash; som bilder du minns</div>
</div>
<div class="platta" id="platta-outro">
  <div class="titel">Redo att ta &ouml;ver v&auml;rlden? &#127757;</div>
</div>
<div id="kort"></div>
<div class="url">jonasgeografi.se</div>
<div id="prickar"></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script>
  // ── stjärnhimmel ──
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'stjarna';
    const d = Math.random() * 2.4 + .8;
    s.style.width = s.style.height = d + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animation = `blinka ${(Math.random() * 4 + 2.5).toFixed(1)}s ease-in-out ${(Math.random() * 4).toFixed(1)}s infinite`;
    document.body.appendChild(s);
  }

  // ── den riktiga 3D-globen, samma konst-tiles som spelet ──
  const TACK = '#f2ead8', GUL = '#ffdc32', HOVERGUL = '#ffe9a8';
  const DEMOLANDER = ['chile', 'argentina', 'colombia', 'venezuela'];
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);
  const map = new maplibregl.Map({
    container: 'karta',
    center: [10, 25], zoom: 1.5, maxZoom: 9.5,
    interactive: false, attributionControl: false,
    style: {
      version: 8,
      projection: { type: 'globe' },
      sources: {
        art: { type: 'raster', url: 'pmtiles://tiles/world.pmtiles?v=2', tileSize: 256 },
        jorden: { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: {
          type: 'Polygon', coordinates: [[[-180, -89.9], [-180, 89.9], [180, 89.9],
                                          [180, -89.9], [-180, -89.9]]] } } },
        demo: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
      },
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': 'rgba(0,0,0,0)' } },
        { id: 'hav', type: 'fill', source: 'jorden', paint: { 'fill-color': '#123050' } },
        { id: 'art', type: 'raster', source: 'art', paint: { 'raster-resampling': 'linear' } },
        // spelets täcke: bleknar in över HELA Sydamerika (som testläget),
        // lyser gult när ett land markeras och tonar bort vid avslöjandet
        { id: 'tacke', type: 'fill', source: 'demo',
          paint: {
            'fill-color': ['case',
              ['boolean', ['feature-state', 'markerad'], false], HOVERGUL, TACK],
            'fill-opacity': ['case',
              ['boolean', ['feature-state', 'tackt'], false], 1, 0],
            'fill-opacity-transition': { duration: 1600 },
            'fill-color-transition': { duration: 350 },
          } },
        // landkonturerna på täcket — precis som i quizet på sajten
        { id: 'konturer', type: 'line', source: 'demo',
          paint: {
            'line-color': '#0a0a0a', 'line-width': 1.8,
            'line-opacity': ['case',
              ['boolean', ['feature-state', 'tackt'], false], 0.85, 0],
            'line-opacity-transition': { duration: 1600 },
          },
          layout: { 'line-join': 'round', 'line-cap': 'round' } },
        { id: 'tacke-kant', type: 'line', source: 'demo',
          paint: {
            'line-color': GUL, 'line-width': 4,
            'line-opacity': ['case',
              ['boolean', ['feature-state', 'markerad'], false], 1, 0],
            'line-opacity-transition': { duration: 350 },
          },
          layout: { 'line-join': 'round', 'line-cap': 'round' } },
      ],
    },
  });
  // hela Sydamerika hämtas ur spelets riktiga geodata — täcket ska ligga
  // över alla länder (som testläget), bara demoländerna avslöjas sedan
  const alla = [];   // { namn, gid } för varje sydamerikanskt land
  fetch('assets/art-regions.json?v=2').then(r => r.json()).then(gj => {
    const val = gj.features.filter(f =>
      (f.properties.key || '').startsWith('sydamerika/'));
    for (const f of val) alla.push({ namn: (f.properties.key || '').split('/')[1], gid: f.id });
    const satt = () => {
      const src = map.getSource('demo');
      if (!src) { map.once('styledata', satt); return; }   // stilen inte klar än
      src.setData({ type: 'FeatureCollection', features: val });
      sattTillstand();   // ifall presentationen redan bläddrat vidare
    };
    satt();
  });
  // önskat tillstånd per land — appliceras idempotent (bakåtbläddring!)
  let aktLage = { tacke: false, avslojade: [], markerat: null };
  function sattTillstand() {
    for (const { namn, gid } of alla) {
      map.setFeatureState({ source: 'demo', id: gid }, {
        tackt: aktLage.tacke && !aktLage.avslojade.includes(namn),
        markerad: namn === aktLage.markerat,
      });
    }
  }

  // långsam snurr på intro/outro
  let snurrId = null;
  function startaSnurr() {
    stoppaSnurr();
    let last = performance.now();
    const tick = t => {
      const dt = Math.min(0.1, (t - last) / 1000); last = t;
      const c = map.getCenter();
      map.setCenter([c.lng + 3.2 * dt, c.lat]);
      snurrId = requestAnimationFrame(tick);
    };
    snurrId = requestAnimationFrame(tick);
  }
  function stoppaSnurr() { if (snurrId !== null) { cancelAnimationFrame(snurrId); snurrId = null; } }

  // ── stegen: klicka fram i egen takt ──
  const LANDKORT = {
    chile:     { namn: 'Chile', bild: 'assets/sydamerika/countries/chile.webp',
                 assoc: 'En lång smal CHILI-peppar' },
    argentina: { namn: 'Argentina', bild: 'assets/sydamerika/countries/argentina.webp',
                 assoc: 'En ARG kille som fått en kycklingklubba i ögat' },
    colombia:  { namn: 'Colombia', bild: 'assets/sydamerika/countries/colombia.webp',
                 assoc: 'En COOL ko med solglasögon' },
    venezuela: { namn: 'Venezuela', bild: 'assets/sydamerika/countries/venezuela.webp',
                 assoc: 'En VÄN som kommer springande och hälsar' },
  };
  const KORTPADDING = () => ({ right: Math.round(innerWidth * 0.30) });
  // varje land i två klick, precis som i spelet: först MARKERAS formen,
  // sedan avslöjas bilden och kortet med minnesregeln visas
  const STEG = [
    { kamera: { center: [10, 25], zoom: 1.5, duration: 2400 }, snurr: true,
      platta: 'platta-intro',
      lage: { tacke: false, avslojade: [], markerat: null } },
    { kamera: { center: [-60, -22], zoom: 2.2, duration: 3200 },
      lage: { tacke: true, avslojade: [], markerat: null } },
    { kamera: { center: [-70.5, -34], zoom: 2.9, duration: 2200, padd: true },
      lage: { tacke: true, avslojade: [], markerat: 'chile' } },
    { kort: 'chile',
      lage: { tacke: true, avslojade: ['chile'], markerat: null } },
    { kamera: { center: [-62, -37], zoom: 2.9, duration: 2000, padd: true },
      lage: { tacke: true, avslojade: ['chile'], markerat: 'argentina' } },
    { kort: 'argentina',
      lage: { tacke: true, avslojade: ['chile', 'argentina'], markerat: null } },
    { kamera: { center: [-73.1, 4.3], zoom: 3.8, duration: 2200, padd: true },
      lage: { tacke: true, avslojade: ['chile', 'argentina'], markerat: 'colombia' } },
    { kort: 'colombia',
      lage: { tacke: true, avslojade: ['chile', 'argentina', 'colombia'], markerat: null } },
    { kamera: { center: [-66.8, 6.6], zoom: 3.8, duration: 2000, padd: true },
      lage: { tacke: true, avslojade: ['chile', 'argentina', 'colombia'], markerat: 'venezuela' } },
    { kort: 'venezuela',
      lage: { tacke: true, avslojade: DEMOLANDER, markerat: null } },
    { kamera: { center: [10, 15], zoom: 1.5, duration: 3000 }, snurr: true,
      platta: 'platta-outro',
      lage: { tacke: true, avslojade: DEMOLANDER, markerat: null } },
  ];

  const kortEl = document.getElementById('kort');
  const prickarEl = document.getElementById('prickar');
  STEG.forEach(() => prickarEl.appendChild(document.createElement('i')));
  const markera = t => t.replace(/([A-ZÅÄÖ]{2,}(?:-[a-zåäö]+)?)/g, '<b>$1</b>');

  let steg = -1;
  function visaSteg(n) {
    if (n < 0 || n >= STEG.length || n === steg) return;
    steg = n;
    const s = STEG[n];
    stoppaSnurr();
    if (s.kamera) {
      map.stop();
      map.flyTo({ center: s.kamera.center, zoom: s.kamera.zoom,
                  duration: s.kamera.duration, essential: true,
                  padding: s.kamera.padd ? KORTPADDING() : { right: 0 } });
    }
    if (s.snurr) {
      map.once('moveend', () => { if (STEG[steg] && STEG[steg].snurr) startaSnurr(); });
    }
    // spelmekaniken: täcke → markering → avslöjad bild
    aktLage = s.lage;
    sattTillstand();
    // titelplattor
    for (const id of ['platta-intro', 'platta-outro']) {
      document.getElementById(id).classList.toggle('synlig', s.platta === id);
    }
    // landkort
    if (s.kort) {
      const l = LANDKORT[s.kort];
      kortEl.innerHTML = `<img src="${l.bild}" alt="">
        <div class="fraga">Hur minns man var landet ligger?</div>
        <div class="assoc">${markera(l.assoc)}</div>
        <div class="pil">&rarr; <span class="namn">${l.namn}!</span></div>`;
      kortEl.classList.add('synlig');
    } else {
      kortEl.classList.remove('synlig');
    }
    // stegvisare + tips
    prickarEl.querySelectorAll('i').forEach((p, i) => p.classList.toggle('nu', i === n));
  }

  function nasta() { visaSteg(Math.min(steg + 1, STEG.length - 1)); }
  function forra() { visaSteg(Math.max(steg - 1, 0)); }
  document.addEventListener('click', nasta);
  document.addEventListener('keydown', e => {
    if ([' ', 'ArrowRight', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); nasta(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); forra(); }
  });

  visaSteg(0);
</script>
</body>
</html>
